<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>三叶面板</title>
<link rel="icon" href="/assets/her-icon.ico" />
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span> 三叶面板</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="conn" class="conn">连接中…</div>
      <label class="auto"><input type="checkbox" id="autoRefresh" checked /> 自动刷新 20s</label>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="pills" id="pills"></div>
      <div class="top-right">
        <span id="clock" class="clock"></span>
        <button id="btnRefresh" class="btn ghost" title="立即刷新">刷新</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="tokenGate" class="gate hidden">
  <div class="gate-box">
    <h2>需要面板口令</h2>
    <p class="muted">正常从桌面 <b>「三叶面板」</b> 快捷方式进来就不用输。<br>
    如果看到这一页：口令存在 <code>C:\Users\31606\her\her-token.txt</code>，或服务器 <code>/opt/her-console/token.txt</code>。</p>
    <input id="tokenInput" type="password" placeholder="粘贴口令" autocomplete="off" />
    <button id="tokenSave" class="btn">进入</button>
    <div id="tokenErr" class="err"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/assets/app.js?v=20261106b2"></script>
</body>
</html>
